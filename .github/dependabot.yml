version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # The application image (Dockerfile at the repository root).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"

  # The Caddy image (deploy/caddy/Dockerfile).
  - package-ecosystem: docker
    directory: /deploy/caddy
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(docker)"
