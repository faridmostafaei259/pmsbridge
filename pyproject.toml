[project]
name = "pmsbridge"
version = "0.1.0.dev0"
description = "Self-hosted MCP gateway that connects AI assistants to property management systems (Guesty, Hostaway)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "certifi>=2026.11.20",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpcore[asyncio]>=1.0.9",
    "jinja2>=3.1.6",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
pmsbridge-app = "pmsbridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmsbridge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/CHANGELOG.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "N", "SIM", "PL", "BLE", "T20"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# The revision template imports `sa` and `op`, which a small migration may not use.
"src/pmsbridge/migrations/versions/*" = ["F401"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pyyaml>=6.0.4",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "shellcheck-py>=0.11.0.1",
]
docs = [
    "mkdocs-material>=9.8.2",
]
