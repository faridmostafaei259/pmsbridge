# Alembic settings for developers who run it by hand from the repository. Autogenerate compares the
# models with a real database, so first bring a local development database up to date (the
# .devdata folder and its database and backups are ignored by git), then generate:
#   ENVIRONMENT=development DATA_DIR=./.devdata uv run alembic upgrade head
#   ENVIRONMENT=development DATA_DIR=./.devdata uv run alembic revision --autogenerate -m "add widgets"
# Set the new revision's down_revision to the current head (there must be exactly one head).
# The application itself does not read this file: it builds the same configuration in code
# (pmsbridge.core.storage.alembic_config) because the container image contains only src/.
# The database file is taken from the application settings (DATA_DIR / DATABASE_PATH).

[alembic]
script_location = %(here)s/src/pmsbridge/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
