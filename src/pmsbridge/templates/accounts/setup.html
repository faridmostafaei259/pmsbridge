{% extends "base.html" %}
{% block title %}{{ title }} - pmsbridge{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  <p>For {{ email }}. Use 12 to 256 characters. A long sentence works well.</p>
  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="{{ path }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="password">New password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required autofocus>
    <label for="confirm">Repeat the password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
