{% extends "base.html" %}
{% block title %}Two-factor code - pmsbridge{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Enter your code</h1>
  <p>Signing in as {{ email }}. Open your authenticator app and enter the 6-digit code, or use one of your recovery codes.</p>
  {% if error %}
  <p class="error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login/verify">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="code">Code</label>
    <input id="code" name="code" type="text" inputmode="text" autocomplete="one-time-code" maxlength="64" required autofocus>
    <button type="submit">Verify</button>
  </form>
</section>
{% endblock %}
