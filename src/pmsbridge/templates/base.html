<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}pmsbridge{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">pmsbridge</a>
    {% if user %}
    <nav>
      <a href="/account/apps">Connected apps</a>
      {% if user.role == "admin" %}
      <a href="/admin/users">Users</a>
      <a href="/admin/assistants">Assistants</a>
      {% endif %}
    </nav>
    {% endif %}
    {% if user and csrf_token %}
    <form class="signout" method="post" action="/logout">
      <span class="who">{{ user.email }}</span>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="link">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
